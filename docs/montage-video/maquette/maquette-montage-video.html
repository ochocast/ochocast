    <div style="flex: 1 1 320px; max-width: 560px; display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 999px; padding: 10px 20px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#062218" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input aria-label="Rechercher des vidéos" placeholder="Rechercher des vidéos" style="flex: 1; min-width: 0; border: none; outline: none; font-family: 'Outfit', sans-serif; font-size: 18px; background: transparent; color: #062218">
    </div>
  </header>

  <main style="max-width: 1280px; margin: 0 auto; padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 24px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; color: #105F42; font-weight: 600; font-size: 17px; text-decoration: none; min-height: 44px">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#105F42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      Retour à la vidéo
    </a>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 36px; font-weight: 700">Monter la vidéo</h1>
      <p style="margin: 0; color: #606060; font-size: 18px">Soutenance Octo 3.0 · original de 50:12</p>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
      <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
        <div style="position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000000; border-radius: 20px; overflow: hidden">
          <sc-for list="{{ activeTexts }}" as="a" hint-placeholder-count="1">
            <div style="{{ a.wrapStyle }}">
              <span style="{{ a.textStyle }}">{{ a.label }}</span>
            </div>
          </sc-for>
          <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 24px; display: flex; align-items: center; gap: 16px; color: #FFFFFF; font-size: 16px; background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0))">
            <button aria-label="{{ playLabel }}" onClick="{{ togglePlay }}" style="width: 44px; height: 44px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 50%">
              <sc-if value="{{ notPlaying }}" hint-placeholder-val="{{ true }}">
                <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M7 4l13 8-13 8z"/></svg>
              </sc-if>
              <sc-if value="{{ playing }}" hint-placeholder-val="{{ false }}">
                <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="#FFFFFF"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
              </sc-if>
            </button>
            <span>{{ timeLabel }}</span>
            <div style="flex: 1; height: 4px; background: rgba(255,255,255,0.35); border-radius: 2px; position: relative">
              <div style="{{ progressStyle }}"></div>
            </div>
          </div>
        </div>

        <div style="background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 20px; padding: 20px 24px; display: flex; flex-direction: column; gap: 18px">
          <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
            <h2 style="margin: 0; font-size: 22px; font-weight: 700">Timeline</h2>
            <div style="display: flex; flex-wrap: wrap; gap: 12px">
              <button onClick="{{ cutHere }}" style="display: inline-flex; align-items: center; gap: 8px; background: #FFFFFF; border: 2px solid #11825A; color: #105F42; border-radius: 20px; padding: 8px 18px; font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 600; min-height: 44px; cursor: pointer">
                <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#105F42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/></svg>
                Couper ici
              </button>
              <button onClick="{{ addText }}" style="display: inline-flex; align-items: center; gap: 8px; background: #FFFFFF; border: 2px solid #11825A; color: #105F42; border-radius: 20px; padding: 8px 18px; font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 600; min-height: 44px; cursor: pointer">
                <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#105F42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>
                Ajouter du texte
              </button>
              <button onClick="{{ deleteText }}" style="display: inline-flex; align-items: center; gap: 8px; background: #FFFFFF; border: 2px solid #D1D5DB; color: #062218; border-radius: 20px; padding: 8px 18px; font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 600; min-height: 44px; cursor: pointer">Supprimer le texte</button>
            </div>
          </div>

          <div style="position: relative; padding-top: 10px">
            <span style="position: absolute; left: 0; top: 22px; font-size: 14px; font-weight: 600; color: #606060">Texte</span>
            <span style="position: absolute; left: 0; top: 94px; font-size: 14px; font-weight: 600; color: #606060">Vidéo</span>
            <div style="margin-left: 60px; position: relative; height: 130px">
              <div style="position: absolute; left: 0; right: 0; top: 4px; height: 48px; background: #F3F4F6; border: 1px dashed #D1D5DB; border-radius: 10px; box-sizing: border-box"></div>
              <div style="position: absolute; left: 0; right: 0; top: 64px; height: 64px; background: #E5E7EB; border-radius: 10px"></div>
              <sc-for list="{{ segBlocks }}" as="s" hint-placeholder-count="3">
                <div style="{{ s.style }}">{{ s.label }}</div>
              </sc-for>
              <button aria-label="Positionner le curseur sur la timeline" onClick="{{ seek }}" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: transparent; border: none; padding: 0; cursor: pointer"></button>
              <sc-for list="{{ textBars }}" as="b" hint-placeholder-count="3">
                <button aria-label="{{ b.aria }}" onClick="{{ b.pick }}" style="{{ b.style }}">
                  <span style="{{ b.handleStyle }}"></span>
                  <span style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{ b.label }}</span>
                  <span style="{{ b.handleStyle }}"></span>
                </button>
              </sc-for>
              <div style="{{ playheadStyle }}"></div>
            </div>
            <div style="margin-left: 60px; display: flex; justify-content: space-between; color: #606060; font-size: 15px; padding-top: 6px">
              <span>00:00</span><span>{{ midLabel }}</span><span>{{ endLabel }}</span>
            </div>
          </div>
          <p style="margin: 0; color: #606060; font-size: 15px">Clique sur la timeline pour placer le curseur, puis « Couper ici » ou « Ajouter du texte ». Clique sur un bloc de texte pour le modifier. La lecture est accélérée pour la démo.</p>
        </div>
      </div>

      <div style="flex: 1 1 340px; max-width: 440px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
        <div style="background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 20px; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
            <h2 style="margin: 0; font-size: 22px; font-weight: 700">Passages</h2>
            <span style="font-size: 16px; color: #105F42; font-weight: 600">Durée finale : {{ endLabel }}</span>
          </div>
          <sc-for list="{{ segRows }}" as="r" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 14px; padding: 12px 14px">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#6B7280"><circle cx="9" cy="6" r="1.8"/><circle cx="15" cy="6" r="1.8"/><circle cx="9" cy="12" r="1.8"/><circle cx="15" cy="12" r="1.8"/><circle cx="9" cy="18" r="1.8"/><circle cx="15" cy="18" r="1.8"/></svg>
              <span style="width: 32px; height: 32px; border-radius: 50%; background: #11825A; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{ r.n }}</span>
              <div style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 17px">{{ r.label }}</span><span style="color: #606060; font-size: 15px">{{ r.range }}</span></div>

                </label>
              </div>

                <span style="font-size: 15px; font-weight: 600">Position</span>
                <div style="display: flex; gap: 8px">
                  <sc-for list="{{ posBtns }}" as="p" hint-placeholder-count="3">
                    <button onClick="{{ p.pick }}" style="{{ p.style }}">{{ p.label }}</button>
                  </sc-for>
                </div>
              </div>

                <span style="font-size: 15px; font-weight: 600">Couleur</span>
                <div style="display: flex; gap: 12px">
                  <sc-for list="{{ colorBtns }}" as="c" hint-placeholder-count="3">

      </div>
    </div>
  </main>
</div>

<script type="text/plain" id="code-Main">
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { confirming: false, tick: 0 };
}

componentDidMount() {
this.timer = setInterval(() => {
this.store();
this.setState({ tick: Date.now() });
}, 500);
}

componentWillUnmount() {
clearInterval(this.timer);
}

store() {
let s = null;
try { const v = localStorage.getItem('ocho_montage_v1'); if (v) s = JSON.parse(v); } catch (e) {}
if (!s) { try { if (window.__ocho) s = JSON.parse(JSON.stringify(window.__ocho)); } catch (e) {} }
s = s || { applied: null, pending: null, reverted: false };
if (s.pending && Date.now() - s.pending.startedAt >= 3000) {
s.applied = s.pending.isOriginal ? null : { segs: s.pending.segs, texts: s.pending.texts };
s.reverted = !!s.pending.isOriginal;
s.pending = null;
s.rev = (s.rev || 0) + 1;
this.put(s);
}
return s;
}

put(s) {
try { window.__ocho = s; } catch (e) {}
try { localStorage.setItem('ocho_montage_v1', JSON.stringify(s)); } catch (e) {}
}

fmt(s) {
s = Math.max(0, Math.round(s));
return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

sum(segs) {
return segs.reduce((a, x) => a + x.dur, 0);
}

renderVals() {
const s = this.store();
const isPending = !!s.pending;
const isEdited = !isPending && !!s.applied;
const isOriginal = !isPending && !s.applied;
const origTotal = 3012;
const editedTotal = s.applied ? this.sum(s.applied.segs) : origTotal;

class Component extends DCLogic {
constructor(props) {
super(props);
const f = this.fresh();
const segs = f.segs;
const texts = f.texts;
const tot = segs.reduce((a, x) => a + x.dur, 0);
this.seen = this.store().rev || 0;
this.state = {
segs: segs,
texts: texts,
sel: texts.length ? texts[0].id : null,
t: Math.min(840, tot),
playing: false,
nid: 10
};
}

componentDidMount() {
this.timer = setInterval(() => {
const cur = this.store();
if ((cur.rev || 0) !== this.seen) {
this.seen = cur.rev || 0;
const f = this.fresh();
this.setState({ segs: f.segs, texts: f.texts, sel: f.texts.length ? f.texts[0].id : null, t: 0, playing: false });
return;
}
if (!this.state.playing) return;
const total = this.total();
const t = this.state.t + 20;
if (t >= total) this.setState({ t: total, playing: false });
else this.setState({ t: t });
}, 250);
}

componentWillUnmount() {
clearInterval(this.timer);
}

fresh() {
const s = this.store();
let segs = [{ id: 's1', dur: 750, src: 120 }, { id: 's2', dur: 935, src: 1270 }, { id: 's3', dur: 510, src: 2460 }];
let texts = [
{ id: 't1', label: 'Ouverture', start: 0, end: 300, pos: 'bottom', color: 'white' },
{ id: 't2', label: 'Partie 2 : démonstration', start: 750, end: 1350, pos: 'bottom', color: 'white' },
{ id: 't3', label: 'Merci !', start: 1920, end: 2195, pos: 'center', color: 'white' }
];
if (s.applied) { segs = s.applied.segs; texts = s.applied.texts; }
else if (s.reverted) { segs = [{ id: 'o1', dur: 3012, src: 0 }]; texts = []; }
return { segs: segs, texts: texts };
}

store() {
let s = null;
try { const v = localStorage.getItem('ocho_montage_v1'); if (v) s = JSON.parse(v); } catch (e) {}
if (!s) { try { if (window.__ocho) s = JSON.parse(JSON.stringify(window.__ocho)); } catch (e) {} }
s = s || { applied: null, pending: null, reverted: false };
if (s.pending && Date.now() - s.pending.startedAt >= 3000) {
s.applied = s.pending.isOriginal ? null : { segs: s.pending.segs, texts: s.pending.texts };
s.reverted = !!s.pending.isOriginal;
s.pending = null;
s.rev = (s.rev || 0) + 1;
this.put(s);
}
return s;
}

put(s) {
try { window.__ocho = s; } catch (e) {}
try { localStorage.setItem('ocho_montage_v1', JSON.stringify(s)); } catch (e) {}
}

total() {
return this.state.segs.reduce((a, s) => a + s.dur, 0);
}

fmt(s) {
s = Math.max(0, Math.round(s));
const m = Math.floor(s / 60);
const r = s % 60;
return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}

parse(v) {
const m = /^(\d+):(\d{2})$/.exec(String(v).trim());
return m ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : null;
}

updateText(id, patch) {
this.setState({ texts: this.state.texts.map((x) => (x.id === id ? Object.assign({}, x, patch) : x)) });
}

fitTexts(texts, total) {
return texts
.filter((x) => x.start < total - 1)
.map((x) => Object.assign({}, x, { end: Math.min(x.end, total) }));
}

renderVals() {
const st = this.state;
const total = this.total();
const fmt = (s) => this.fmt(s);
const colors = { white: '#FFFFFF', black: '#000000', green: '#1DAC78' };

let cum = 0;
const segBlocks = st.segs.map((s, i) => {
const left = (cum / total) * 100;
const width = (s.dur / total) * 100;
cum += s.dur;
return {
key: s.id,
label: 'Passage ' + (i + 1),
style: 'position: absolute; top: 64px; height: 64px; left: ' + left + '%; width: ' + width + '%; background: #1DAC78; border-left: 3px solid #F9FAFB; border-right: 3px solid #F9FAFB; border-radius: 10px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: #062218; overflow: hidden; white-space: nowrap'

: { label: '', startLabel: '', endLabel: '' };

const posBtns = [['top', 'Haut'], ['center', 'Centre'], ['bottom', 'Bas']].map((p) => {
const on = selText && selText.pos === p[0];
return {
key: p[0],
label: p[1],
style: 'flex: 1; min-height: 44px; border-radius: 12px; font-family: Outfit, sans-serif; font-size: 16px; cursor: pointer; ' + (on ? 'border: 2px solid #11825A; background: #DBF4EA; color: #105F42; font-weight: 700' : 'border: 2px solid #D1D5DB; background: #FFFFFF; color: #062218; font-weight: 600'),
pick: () => selText && this.updateText(selText.id, { pos: p[0] })
};
});

const colorBtns = [['white', 'Blanc'], ['black', 'Noir'], ['green', 'Vert']].map((c) => {
const on = selText && selText.color === c[0];
return {
key: c[0],
aria: c[1] + (on ? ', sélectionné' : ''),
style: 'width: 44px; height: 44px; border-radius: 50%; cursor: pointer; background: ' + colors[c[0]] + '; border: 3px solid ' + (on ? '#11825A' : '#D1D5DB'),
pick: () => selText && this.updateText(selText.id, { color: c[0] })
};
});

const activeTexts = st.texts
.filter((x) => x.start <= st.t && st.t < x.end)
.map((x) => {
const place = x.pos === 'top' ? 'top: 28px' : x.pos === 'center' ? 'top: 50%; margin-top: -26px' : 'bottom: 84px';
return {
key: x.id,
label: x.label,
wrapStyle: 'position: absolute; left: 0; right: 0; display: flex; justify-content: center; ' + place,
textStyle: 'border: 2px dashed rgba(255,255,255,0.85); border-radius: 8px; padding: 6px 18px; font-size: 30px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,0.8); color: ' + colors[x.color]
};
});

return {
segBlocks: segBlocks,
segRows: segRows,
textBars: textBars,
sel: sel,
hasSel: !!selText,
noSel: !selText,
posBtns: posBtns,
colorBtns: colorBtns,
activeTexts: activeTexts,
textCount: st.texts.length + (st.texts.length > 1 ? ' textes' : ' texte'),
endLabel: fmt(total),
midLabel: fmt(total / 2),
timeLabel: fmt(st.t) + ' / ' + fmt(total),
progressStyle: 'position: absolute; left: 0; top: 0; height: 4px; background: #1DAC78; border-radius: 2px; width: ' + (st.t / total) * 100 + '%',
playheadStyle: 'position: absolute; top: -8px; height: 144px; width: 4px; background: #062218; border-radius: 2px; pointer-events: none; left: ' + (st.t / total) * 100 + '%',
playing: st.playing,
notPlaying: !st.playing,
playLabel: st.playing ? 'Mettre en pause' : 'Lire',

seek: (e) => {

},

const first = st.t - c;

const b = { id: 'n' + (st.nid + 1), dur: s.dur - first, src: s.src + first };

}

});
},

},
onLabel: (e) => selText && this.updateText(selText.id, { label: e.target.value }),
onStart: (e) => {

if (selText && v !== null && v < selText.end && v >= 0) this.updateText(selText.id, { start: v });
},

const v = this.parse(e.target.value);

cur.pending = { segs: st.segs, texts: st.texts, isOriginal: isOriginal, startedAt: Date.now() };

},
revert: () => this.setState({
segs: [{ id: 'o1', dur: 3012, src: 0 }],
texts: [],
sel: null,
t: 0,
playing: false

};
}
}
