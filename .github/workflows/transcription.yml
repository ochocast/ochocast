name: Validate and build Whisper transcription

on:
  pull_request:
    paths:
      - 'ffmpegServer/Dockerfile.transcript'
      - 'ffmpegServer/transcript/**'
      - 'backend/src/transcription/**'
      - 'backend/src/migrations/*AutomaticTranscription*'
      - 'backend/src/transcoding-jobs/**'
      - 'ffmpegServer/src/services/transcoding.service.ts'
      - 'dev-tools/transcription-tests/**'
      - 'dev-tools/localMinio/Dockerfile.test'
      - 'e2e/assets/**'
      - 'backend/package*.json'
      - '.github/workflows/transcription.yml'
  push:
    branches: [main]
    paths:
      - 'ffmpegServer/Dockerfile.transcript'
      - 'ffmpegServer/transcript/**'
      - 'backend/src/transcription/**'
      - 'backend/src/migrations/*AutomaticTranscription*'
      - 'backend/src/transcoding-jobs/**'
      - 'ffmpegServer/src/services/transcoding.service.ts'
      - 'dev-tools/transcription-tests/**'
      - 'dev-tools/localMinio/Dockerfile.test'
      - 'e2e/assets/**'
      - 'backend/package*.json'
      - '.github/workflows/transcription.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish CPU and GPU images to the configured registry
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx tsc --noEmit
        working-directory: backend
      - run: npm run test:transcription
        working-directory: backend
      - run: python3 -m py_compile ffmpegServer/transcript/server.py
      - run: python3 -m unittest discover -s ffmpegServer/transcript

  integration:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            ffmpegServer/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --prefix backend && npm ci --prefix ffmpegServer
      - name: Start isolated PostgreSQL, S3 and Whisper
        run: docker compose -f dev-tools/transcription-tests/docker-compose.yml up --build -d
      # The integration spec waits for model readiness, and fails at once on a
      # model that cannot load.
      - name: Transcribe real speech and verify silence and manual subtitles
        working-directory: backend
        env:
          TRANSCRIPTION_TEST_DATABASE_URL: postgresql://transcription:transcription@127.0.0.1:25439/transcription_test
          TRANSCRIPTION_TEST_S3_SIGNING_URL: http://minio:9000
        run: npm run test:transcription
      - name: Show isolated service logs on failure
        if: failure()
        run: docker compose -f dev-tools/transcription-tests/docker-compose.yml logs --tail=100
      - name: Remove isolated services
        if: always()
        run: docker compose -f dev-tools/transcription-tests/docker-compose.yml down -v

  image:
    needs: [validate, integration]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [cpu, gpu]
    env:
      IMAGE_REPOSITORY: ${{ vars.TRANSCRIPT_IMAGE_REPOSITORY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Resolve image metadata
        id: image
        env:
          SHOULD_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$SHOULD_PUBLISH" = true ] && [ -z "$IMAGE_REPOSITORY" ]; then
            echo 'Configure TRANSCRIPT_IMAGE_REPOSITORY before publishing.' >&2
            exit 1
          fi
          echo "ref=${IMAGE_REPOSITORY:-ochocast-transcript}:sha-${GITHUB_SHA}-${TARGET}" >> "$GITHUB_OUTPUT"
          echo "registry=${IMAGE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3
      - uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3
        if: steps.image.outputs.publish == 'true'
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ secrets.SCW_REG_USER }}
          password: ${{ secrets.SCW_SECRET_KEY }}
      - name: Build and optionally publish
        id: build
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5
        with:
          context: ffmpegServer
          file: ffmpegServer/Dockerfile.transcript
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ steps.image.outputs.publish == 'true' }}
          tags: ${{ steps.image.outputs.ref }}
      - name: Report image for ops-architecture-lab
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISHED: ${{ steps.image.outputs.publish }}
        run: |
          {
            echo "Whisper image: $IMAGE_REF"
            echo "Digest: $DIGEST"
            echo "Published: $PUBLISHED"
            echo 'L4 requires the GPU image; PRO2-S requires the CPU image.'
            echo 'A successful build does not validate GPU inference: check /health on the target VM.'
          } >> "$GITHUB_STEP_SUMMARY"
