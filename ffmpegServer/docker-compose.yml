# Local HTTP smoke test only. In staging, Scaleway Queues invokes the container.
services:
  ffmpeg-http:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8081:8080'
    environment:
      NODE_ENV: development
      PORT: 8080
      TRANSCODING_BACKEND_URL: ${LOCAL_TRANSCODING_BACKEND_URL:-http://host.docker.internal:3001/api}
      TRANSCODING_DISPATCH_SECRET: ${TRANSCODING_DISPATCH_SECRET:?Set TRANSCODING_DISPATCH_SECRET}
      TRANSCODING_CALLBACK_SECRET: ${TRANSCODING_CALLBACK_SECRET:?Set TRANSCODING_CALLBACK_SECRET}
      MINIO_ENDPOINT: host.docker.internal
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_USE_SSL: 'false'
      STOCK_MEDIA_BUCKET: ${STOCK_MEDIA_BUCKET:-media}
      STOCK_MINIATURE_BUCKET: ${STOCK_MINIATURE_BUCKET:-miniature}
      FFMPEG_THREADS: 2
    extra_hosts:
      - host.docker.internal:host-gateway
