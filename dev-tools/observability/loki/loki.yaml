# Single-process Loki with local storage and a ruler sending to Alertmanager.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  # Index only low-cardinality resource attributes; everything else (trace_id,
  # upload.id, context...) stays as structured metadata.
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes: [deployment.environment.name]

# Rules are files in the repo: loki/rules/fake/*.yaml ("fake" = single tenant).
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  evaluation_interval: 30s
  enable_api: true
  ring:
    kvstore:
      store: inmemory
